# Settings of the PortMaster launcher. Remove the leading # of a line to change it.

# 3D render size: native (the Wii's 640x448, default and fastest), 2x, 3x, 4x, or window (full screen size).
#RESOLUTION=native

# Antialiasing of 3D edges: off (default) or 4x (needs a strong GPU).
#ANTIALIASING=off

# Game layout: auto (by screen shape, default), 4:3 or 16:9.
#ASPECT=auto

# Print one [perf] line per second (fps, frame times) into log.txt: 1 or 0.
#PERF_LOG=0

# SDL3 backend: shim (the firmware's own SDL2, default) or native (SDL3 on KMSDRM, a fallback).
#SDL_BACKEND=shim

# Movies on a 4:3 screen: 1 fills the screen height (the sides are cropped), 0 keeps the original 16:9 box with bars (default).
#MOVIE_ZOOM=0
